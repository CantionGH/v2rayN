name: macOS privileged TUN validation

on:
  workflow_dispatch:
  push:
    branches: [feat/macos-privileged-tun-helper, feat/macos-local-trust-tun]
  pull_request:
    paths:
      - 'macos/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - '.github/workflows/macos-tun-helper.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build both architectures
        run: |
          bash macos/build-tun-helper.sh osx-arm64 "$RUNNER_TEMP/tun-arm64"
          bash macos/build-tun-helper.sh osx-x64 "$RUNNER_TEMP/tun-x64"
          bash macos/build-tun-helper.sh osx-arm64 "$RUNNER_TEMP/tun-local-arm64" local
          bash macos/build-tun-helper.sh osx-x64 "$RUNNER_TEMP/tun-local-x64" local
      - name: Test native security policy (no root or signing credentials needed)
        run: |
          bash macos/test-tun-helper.sh "$RUNNER_TEMP/tun-tests"
          bash macos/test-tun-helper.sh "$RUNNER_TEMP/tun-local-tests" local
      - name: Validate launch daemon definition and scripts
        run: |
          plutil -lint macos/TunHelper/2dust.v2rayN.TunHelper.plist
          plutil -lint macos/TunHelper/2dust.v2rayN.LocalTunHelper.plist
          for script in macos/*.sh macos/local-installer/*; do bash -n "$script"; done

  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Build and test ServiceLib
        # Existing database tests share static state; avoid their intermittent
        # parallel SQLite failures observed on the first hosted run.
        run: dotnet test --project v2rayN/ServiceLib.Tests -c Release -p:PublishAot=false -- --maximum-parallel-tests 1
